name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # actions/setup-python v7.0.0
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov radon bandit

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Run UI-glue logic tests (Node)
        run: node --test tests/jobqueue.test.mjs

      - name: Bandit security scan
        run: bandit -q -r p8.py tools/crap_gate.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests --cov=p8 --cov-report=json:coverage.json \
            --cov-report=term-missing -q

      - name: CRAP gate (complexity vs. coverage)
        run: python tools/crap_gate.py --source p8.py --coverage-file coverage.json --threshold 30
