name: Mutation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install mutmut pytest

      - name: Mutation testing (mutmut)
        run: python tools/mutation_gate.py --threshold 75
